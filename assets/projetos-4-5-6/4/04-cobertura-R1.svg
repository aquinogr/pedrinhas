<text x="14" y="2.0" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Lajes de cobertura com regularização inclinada.</text>
<text x="14" y="2.7" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Coletores e condutores representados no modelo.</text>
<text x="14" y="3.4" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Descarga prevista para sistema dentro do próprio lote.</text>
<text x="14" y="4.1" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Não usar muro do vizinho como apoio nem drenagem.</text>
<text x="14" y="4.8" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Pátio lateral aberto ao céu entre cozinha e gourmet.</text>
<text x="14" y="5.5" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Vão da escada coberto no nível superior, sem laje no vazio.</text>
<text x="14" y="6.199999999999999" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Cobertura da cozinha fechada nesta revisão.</text>
<text x="14" y="6.8999999999999995" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Estrutura, impermeabilização e hidráulica: detalhar em executivo.</text>
<text x="14" y="9.0" text-anchor="start" font-family="Arial,sans-serif" font-size="0.26" fill="#283f35">Recuos das faces de paredes/pilares:</text>
<text x="14" y="9.7" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Frente: mínimo desenhado 5,05 m</text>
<text x="14" y="10.299999999999999" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Laterais: mínimo desenhado 1,55 m</text>
<text x="14" y="10.899999999999999" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Fundos do bloco de apoio: 1,50 m</text>
<text x="14" y="11.5" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">Beirais tratados separadamente; validação municipal necessária.</text>
<text x="14" y="14" text-anchor="start" font-family="Arial,sans-serif" font-size="0.23" fill="#283f35">Não foi confirmada a zona cadastral do lote.</text>
<text x="14" y="14.7" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">LC 034/2022: art. 141 remete ao Anexo 13-A.</text>
<text x="14" y="15.4" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">A implantação atende às premissas do briefing;</text>
<text x="14" y="16.1" text-anchor="start" font-family="Arial,sans-serif" font-size="0.22" fill="#283f35">isso não equivale a aprovação urbanística.</text>
