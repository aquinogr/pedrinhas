<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa 4 · 3D navegável</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2ea;color:#22302a;font:13px system-ui}.bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px}button{background:#fffdf8;color:#22302a;border:1px solid #b8c3b3;border-radius:4px;padding:7px 10px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2e4937;color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #ae7655}#model{display:block;width:100%;height:calc(100dvh - 147px);min-height:250px;touch-action:none}#status{margin:7px 10px;min-height:20px}.info{padding:0 10px 8px;font-size:11px;color:#5f6b62}@media(min-width:700px){#model{height:calc(100dvh - 125px)}}</style><div class="bar"><button data-mode="full" aria-pressed="true">Completo</button><button data-mode="roof" aria-pressed="false">Sem cobertura</button><button data-mode="ground" aria-pressed="false">Térreo aberto</button><button data-mode="upper" aria-pressed="false">Superior aberto</button></div><div class="bar"><button id="reset">Conjunto</button><button id="front">Fachada</button><button id="pool">Piscina</button><button id="stair">Escada</button><button id="top">De cima</button><button id="fullscreen">Tela cheia ⤢</button></div><canvas id="model" tabindex="0" aria-label="Modelo tridimensional navegável da casa 4"></canvas><p id="status" role="status">Carregando modelo…</p><div class="info">Arraste para girar; roda para aproximar; dois dedos para deslocar. Estudo preliminar. <a href="../../../projetos-4-5-6.html?projeto=4" target="_top">Voltar à apresentação</a></div><script src="../../revisadas/three.min.js"></script><script src="../../revisadas/OrbitControls.js"></script><script src="../../revisadas/GLTFLoader.js"></script><script>(()=>{'use strict';const canvas=document.getElementById('model'),status=document.getElementById('status');let renderer,root,controls,camera,active='full';const saved=[];
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.setClearColor(0xe7e7dc)}catch(e){status.textContent='O navegador não disponibilizou WebGL. As plantas e imagens continuam acessíveis abaixo.';return}
const scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,1,.05,300);controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=false;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=1.5;controls.maxDistance=130;scene.add(new THREE.HemisphereLight(0xffffff,0x756c59,.85));const sun=new THREE.DirectionalLight(0xfff1d9,1.1);sun.position.set(-15,35,12);scene.add(sun);const fill=new THREE.DirectionalLight(0xecf4ff,.35);fill.position.set(22,10,-35);scene.add(fill);
function draw(){renderer.render(scene,camera)}controls.addEventListener('change',draw);function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw()}}new ResizeObserver(resize).observe(canvas);resize();
function view(pos,target){camera.up.set(0,1,0);camera.position.set(...pos);controls.target.set(...target);controls.update();draw()}
function fit(){if(!root)return;const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const radius=size.length()/2,half=Math.min(camera.fov*Math.PI/360,Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect));let distance=radius/Math.sin(half)*1.04;const dir=new THREE.Vector3(.72,.95,.85).normalize();for(let i=0;i<5;i++){view(center.clone().addScaledVector(dir,distance).toArray(),center.toArray());camera.updateMatrixWorld();let extent=0;for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const p=new THREE.Vector3(x,y,z).project(camera);extent=Math.max(extent,Math.abs(p.x),Math.abs(p.y))}distance*=extent/.89}view(center.clone().addScaledVector(dir,distance).toArray(),center.toArray())}
function mode(value){active=value;for(const a of saved){a.object.visible=!(a.roof&&value!=='full'||value==='ground'&&a.minY>=3-.001||value==='upper'&&a.maxY<3.13)}renderer.clippingPlanes=value==='ground'?[new THREE.Plane(new THREE.Vector3(0,-1,0),2.45)]:value==='upper'?[new THREE.Plane(new THREE.Vector3(0,1,0),-3.13),new THREE.Plane(new THREE.Vector3(0,-1,0),5.60)]:[];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===value)));draw()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode(b.dataset.mode);if(b.dataset.mode==='upper')view([18,22,-1],[6,4.2,-11.8]);else if(b.dataset.mode==='ground')view([24,32,2],[6,1,-17.5])});
document.getElementById('reset').onclick=()=>{mode('full');fit();status.textContent='Conjunto completo · revisão R1.'};document.getElementById('front').onclick=()=>{mode('full');view([21,13,16],[6,2.2,-7])};document.getElementById('pool').onclick=()=>{mode('full');view([-12,13,-44],[6,1,-28])};document.getElementById('stair').onclick=()=>{mode('roof');renderer.clippingPlanes=[new THREE.Plane(new THREE.Vector3(-1,0,0),10.27),new THREE.Plane(new THREE.Vector3(1,0,0),-7.70),new THREE.Plane(new THREE.Vector3(0,0,1),14.95),new THREE.Plane(new THREE.Vector3(0,0,-1),-10.18),new THREE.Plane(new THREE.Vector3(0,-1,0),4.8)];view([10.5,13,-15],[9.05,1.8,-12]);status.textContent='Recorte 3D da escada: paredes externas seccionadas para expor lances, patamar e proteções.'};document.getElementById('top').onclick=()=>{mode(active==='upper'?'upper':'ground');const upper=active==='upper',target=[6,upper?3.8:0,-(upper?11.8:17.5)];view([6,upper?30:51,target[2]+.01],target)};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await canvas.requestFullscreen()}catch(e){status.textContent='Tela cheia não disponível neste navegador; use o zoom normalmente.'}};
window.__atrioStats=()=>({loaded:!!root,total:saved.length,roofs:saved.filter(a=>a.roof).length,visibleRoofs:saved.filter(a=>a.roof&&a.object.visible).length,visible:saved.filter(a=>a.object.visible).length,mode:active,canvas:[canvas.width,canvas.height]});
function loaded(g){root=g.scene;scene.add(root);root.updateMatrixWorld(true);root.traverse(o=>{if(!o.isMesh)return;const box=new THREE.Box3().setFromObject(o);saved.push({object:o,roof:/^(Cobertura|Caimento|Calha)/i.test(o.name),minY:box.min.y,maxY:box.max.y})});mode('full');fit();status.textContent='Modelo R1 carregado · móveis, vãos, coberturas e proteções representados.'}
function failed(e){console.error(e);status.textContent='Falha ao carregar o 3D. Use o servidor local ou a versão HTML offline; as plantas e imagens estão disponíveis.'}
new THREE.GLTFLoader().load('CASA-04-R1.glb',loaded,undefined,failed);
})();</script></html>
